<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ⚠ THE BARE WORD WAS THE WHOLE TITLE UNTIL 2026-09-15, AND THE BARE
         WORD IS NOT OURS. Searching "occupella" returns an activist a cappella
         ensemble that has held the name since 2011, with news coverage and a
         songbook behind it; Google answers the query with "Did you mean:
         acapella" and an AI overview about the group. Competing for that one
         token is a brand fight measured in years. Naming the CATEGORY and the
         PLATFORM is the half a title tag can win today, because "buildium ai"
         and "ai for property managers" are what somebody types when they have
         the problem this product solves and do not yet know its name.

         ⚠ This is the CRAWLER's title and the first-paint tab title ONLY.
         `hooks/useDocumentTitle` assigns document.title the moment React
         mounts, so lengthening this costs a signed-in user's tab nothing —
         check that hook still does before assuming a longer title is free. -->
    <title>Occupella — AI operations for Buildium property managers</title>

    <!-- Every path vercel.json does not exclude renders THIS document, so
         /inbox, /properties and /settings are the same page under three
         names. Without this a crawler treats them as three competing
         duplicates and picks its own favourite to show.

         ⚠ IT POINTS AT THE ROOT, WHICH IS CORRECT ONLY WHILE THAT IS TRUE.
         The day this app serves real distinct content from a client-side
         route — a pricing page, a public property listing — this line tells
         Google to drop it, and the page simply never appears with nothing
         anywhere reporting why. A second indexable route means this becomes
         per-route or goes. -->
    <link rel="canonical" href="https://app.occupella.com/" />
    <!-- Fonts are self-hosted via @fontsource-variable/geist (imported in
         main.tsx). No external font CDN. -->
    <meta name="author" content="Oscar Ventures LLC" />
    <meta
      name="description"
      content="Occupella is an AI operations assistant for property managers on Buildium — maintenance triage, owner updates and resident follow-ups in one place."
    />

    <!-- The app had NO favicon at all until 2026-09-08, so every open tab
         showed the browser's blank-document glyph and was indistinguishable
         from any other tab. `sizes="any"` on the SVG lets a browser that
         supports it skip the PNG entirely.

         ⚠ THIS COMMENT USED TO CLAIM "same mark as the marketing site" AND IT
         WAS FALSE FOR SIX DAYS. When the wordmark replaced the square-grid
         mark here on 2026-09-15, helixis-onboarding kept the grid — so the tab
         a prospect opened at occupella.com and the tab a customer opened here
         showed two different companies, while this sentence said otherwise.
         A comment cannot fail (gotcha 48), and a fix reaching one surface and
         not the other is gotcha 25's fan-out. The two repos now hold BYTE
         COPIES of favicon.ico / favicon.svg / apple-touch-icon.png /
         icon-*.png / manifest.webmanifest — the relationship social-preview.png
         has always had. REPLACING THE MARK MEANS REPLACING IT IN BOTH REPOS
         IN THE SAME CHANGE; nothing in CI can see across them. -->

    <!-- ⚠ AND THE OTHER REPO'S VERSION OF THIS BLOCK WAS ALSO DEFECTIVE IN A
         WAY THIS ONE WAS NOT: its icon was an inline `data:` URI, so nobody
         noticed /favicon.ico had never been written. Measured 2026-09-21,
         https://occupella.com/favicon.ico answered a real 404 and Google
         rendered the brand's front door with the generic globe. Same lesson as
         the paragraph below, learned twice. -->
    <!-- ⚠ AND THE SVG ALONE WAS NOT ENOUGH FOR SEARCH. occupella.com renders
         with the generic globe in Google's results while every other domain on
         the page shows its mark — which reads as an abandoned site sitting
         between real ones. Two things can cause that and this covers both:
         Google's favicon crawler asks for /favicon.ico by convention, and a
         root-level static file may be shadowed by the SPA rewrite (see
         vercel.json), in which case the SVG was answering with HTML.
         Generated from icon-512.png, so it is the same mark as the manifest
         and the home-screen icon rather than a second drawing that can drift.
         48px is in the file because Google resizes from a multiple of 48.
         Ordered FIRST, but a modern browser still prefers the SVG below —
         `sizes="any"` on an SVG outranks a fixed-size raster. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <!-- ⚠ A PNG, not the SVG. iOS ignores an SVG apple-touch-icon entirely
         and screenshots the page instead, and it paints BLACK behind any
         transparency — so the plate in these files is what controls what a
         home-screen install actually shows. Android Chrome likewise refuses
         an SVG-only manifest for the home screen and substitutes a generated
         letter tile, which is somebody else's icon on the customer's phone. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ⚠ MATCHES the #boot shell's background and --canvas. It read #0e0e11,
         so an installed app painted a near-black splash and then flashed to a
         white first paint — the one place a colour token being wrong is
         visible as a flicker rather than as a shade. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Link previews. Without these a shared app.occupella.com link renders as a
         bare URL in Slack / iMessage / LinkedIn — which reads as a dead or
         unfinished site. og:image is a real product screenshot, not a mockup. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Occupella" />
    <meta property="og:title" content="Occupella — AI operations for property management" />
    <meta
      property="og:description"
      content="Ask about any property, lease, work order or bill in plain English. Built for Buildium."
    />
    <meta property="og:url" content="https://app.occupella.com/" />
    <meta property="og:image" content="https://app.occupella.com/social-preview.png" />
    <meta property="og:image:alt" content="The Occupella chat surface answering a question about a property." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Occupella — AI operations for property management" />
    <meta
      name="twitter:description"
      content="Ask about any property, lease, work order or bill in plain English. Built for Buildium."
    />
    <meta name="twitter:image" content="https://app.occupella.com/social-preview.png" />

    <!-- Who this site is, stated in the one format a search engine parses
         rather than infers. The whole ranking problem here is that "Occupella"
         already resolves to somebody else, so the useful work is not keywords
         — it is telling Google that a DISTINCT entity exists under this name,
         with its own legal entity, logo and category.

         ⚠ DELIBERATELY ABSENT: `sameAs`. It is the strongest disambiguation
         signal there is — the list of profiles that corroborate the entity —
         and every entry has to be a URL that genuinely belongs to this
         company. Inventing a LinkedIn or Crunchbase URL to fill the field
         would be asserting a profile that does not exist, on the one surface
         whose entire job is being verifiable. Add the real ones the day they
         exist; that edit is worth more than everything else in this block.

         ⚠ DELIBERATELY ABSENT: SoftwareApplication with `offers` or
         `aggregateRating`. Those are what earn a star-rating rich result, and
         a fabricated rating is a policy violation that earns a manual action
         rather than a ranking. A rating belongs here when real customers have
         left one.

         ⚠ Every value below also appears in human-readable form on this page
         or in /legal — a structured claim that contradicts the visible page
         is the one thing this format is policed for. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://occupella.com/#organization",
            "name": "Occupella",
            "legalName": "Oscar Ventures LLC",
            "url": "https://occupella.com/",
            "logo": "https://app.occupella.com/icon-512.png",
            "image": "https://app.occupella.com/social-preview.png",
            "email": "team@occupella.com",
            "description": "Occupella is an AI operations assistant for property managers on Buildium — maintenance triage, owner updates and resident follow-ups in one place."
          },
          {
            "@type": "WebSite",
            "@id": "https://app.occupella.com/#website",
            "name": "Occupella",
            "url": "https://app.occupella.com/",
            "publisher": { "@id": "https://occupella.com/#organization" }
          }
        ]
      }
    </script>
    <!-- First paint. Everything above ships in the HTML; the app itself does
         not exist until the module below has been fetched, parsed and mounted.
         Until 2026-09-08 `#root` was empty for that whole window, so a cold
         load on a slow connection showed a blank page with nothing to say
         whether it was loading or broken — and "broken" is the reading people
         reach for.

         Deliberately tiny and inline: a shell that needs its own request has
         not solved anything, because the request is the thing being waited on.
         No script either — `createRoot(...).render()` replaces the children of
         `#root`, so React clears this by mounting. Nothing has to remove it,
         which means nothing can fail to.

         The colours are literals rather than CSS variables on purpose: the
         stylesheet that defines the tokens is part of the bundle this is
         standing in for. They track --canvas / --ink-muted / --iris in
         src/styles/globals.css; a palette change should update them here too,
         and the worst case if it does not is a plain wordmark on white. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        font-family:
          "Geist Variable", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot .mark {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0e1620;
      }
      #boot .bar {
        width: 132px;
        height: 2px;
        border-radius: 2px;
        background: #e8ebef;
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #1e73bc;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      /* Motion here is decoration, and somebody who has asked the system for
         less of it should not get an exception because a page is loading. The
         bar stays, so the page still reads as busy rather than finished. */
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- aria-hidden: a screen reader announcing a wordmark and a progress bar
           for a fraction of a second, then having the whole document replaced
           under it, is noise rather than information. The app announces itself
           once it is actually there. -->
      <div id="boot" aria-hidden="true">
        <span class="mark">Occupella</span>
        <span class="bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Static legal-entity attribution in raw HTML so verification crawlers
         (e.g. A2P/Twilio) that don't execute JS can match the registered
         entity to the site. Wrapped in <noscript>: in a real browser the app
         fills the viewport, and this footer below #root made the page 66px
         taller than the viewport — every scroll dragged the whole shell
         off-screen (release audit bug #2). Crawlers without JS still see it. -->
    <noscript>
      <footer
        style="
          text-align: center;
          padding: 20px 32px 28px;
          font-size: 12px;
          color: #8a8a94;
          font-family: system-ui, sans-serif;
        "
      >
        Occupella is operated by Oscar Ventures LLC.
      </footer>
    </noscript>
  </body>
</html>
