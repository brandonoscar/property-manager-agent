# Dependabot — weekly dependency-update PRs + security bumps for every
# ecosystem in the repo. Pre-pilot, selling on trust with no SOC 2: this is the
# free, native baseline that keeps a known-CVE dependency from sitting unpatched
# between the weekly deps-audit.yml runs (which only file an issue, never bump).
# Grouped so a routine bump week is one PR per ecosystem, not a flood.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # langfuse must stay on the v2 line: LiteLLM's callback reads the
      # ``langfuse.version`` module that v3+ removed — a widened pin crashed
      # prod twice (#713 fixed it, Dependabot #737 silently reverted it).
      # Guarded by tests/unit/test_dependency_pins.py. Migrating to v3 is a
      # deliberate code change, not a version bump.
      - dependency-name: "langfuse"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
