name: Dependency audit

# Weekly supply-chain check: pip-audit (Python) + npm audit (frontend) against
# the dependency trees we actually ship. Compounds over time — every newly
# disclosed CVE in a pinned dep gets surfaced the week it lands, which matters
# for the "sellable / SOC2" bar. Read-only; on findings it files/updates a
# [deps] issue (deduped within the week). No creds needed.

on:
  schedule:
    - cron: "23 13 * * 1" # Mondays ~13:23 UTC (off-minute)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deps-audit
  cancel-in-progress: false

jobs:
  audit:
    name: pip-audit + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (prod-ish extras) + pip-audit
        continue-on-error: true # a flaky extra install must not blank the audit
        run: |
          pip install pip-audit
          pip install -e ".[dev,connectors,memory,security]"

      - name: pip-audit (Python deps)
        id: pyaudit
        continue-on-error: true # non-zero exit = vulns found; we handle below
        run: pip-audit --desc --format json --output py_audit.json

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --json > ../npm_audit.json || true

      - name: Summarize + file issue on findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # ── Python: count vulnerable packages + total advisories ──
          if [ -s py_audit.json ] && jq empty py_audit.json 2>/dev/null; then
            PY_PKGS=$(jq -r '[.dependencies[]? | select((.vulns // []) | length > 0)] | length' py_audit.json)
            PY_VULNS=$(jq -r '[.dependencies[]?.vulns // [] | length] | add // 0' py_audit.json)
          else
            PY_PKGS=0; PY_VULNS=0
          fi

          # ── npm: high + critical only (low/moderate are noise weekly) ──
          if [ -s npm_audit.json ] && jq empty npm_audit.json 2>/dev/null; then
            NPM_HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm_audit.json)
            NPM_CRIT=$(jq -r '.metadata.vulnerabilities.critical // 0' npm_audit.json)
          else
            NPM_HIGH=0; NPM_CRIT=0
          fi
          NPM_HC=$((NPM_HIGH + NPM_CRIT))

          {
            echo "## Dependency audit"
            echo ""
            echo "| Ecosystem | Finding |"
            echo "|---|---|"
            echo "| Python (pip-audit) | ${PY_VULNS} advisorie(s) across ${PY_PKGS} package(s) |"
            echo "| Frontend (npm audit) | ${NPM_CRIT} critical + ${NPM_HIGH} high |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${PY_VULNS}" -eq 0 ] && [ "${NPM_HC}" -eq 0 ]; then
            echo "deps-audit: clean (no Python advisories, no high/critical npm)."
            exit 0
          fi

          {
            echo "## Dependency vulnerabilities found"
            echo ""
            echo "**Python:** ${PY_VULNS} advisorie(s) across ${PY_PKGS} package(s)"
            if [ "${PY_PKGS}" -gt 0 ]; then
              echo ""
              jq -r '.dependencies[]? | select((.vulns // []) | length > 0)
                     | "- **\(.name) \(.version)**: " + ([.vulns[].id] | join(", "))' py_audit.json
            fi
            echo ""
            echo "**Frontend (high+critical):** ${NPM_CRIT} critical, ${NPM_HIGH} high"
            echo ""
            echo "Run \`pip-audit\` / \`cd frontend && npm audit\` locally for fix versions."
            echo ""
            echo "Run: ${RUN_URL}"
            echo "---"
            echo "Filed automatically by .github/workflows/deps-audit.yml."
          } > issue_body.md

          TITLE_SUFFIX="${PY_VULNS} py advisorie(s), ${NPM_HC} npm high+crit"
          NEW_TITLE="[deps] $(date -u +%Y-%m-%d) — ${TITLE_SUFFIX}"
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          DUPE=$(gh issue list --state open \
            --search "in:title \"[deps]\" created:>=${SINCE}" \
            --json number --jq '.[0].number // empty')
          if [ -n "${DUPE}" ]; then
            gh issue comment "${DUPE}" --body-file issue_body.md
          else
            gh issue create --title "${NEW_TITLE}" --body-file issue_body.md --label bug
          fi
